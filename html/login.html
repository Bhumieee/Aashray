<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Aashray</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
  <div class="auth-brand-panel">
    <a class="brand brand-light" href="index.html"><span class="brand-mark">A</span><span>Aashray</span></a>
    <blockquote>“Every rescued resource is a chance to provide better care.”</blockquote>
  </div>
  <main class="auth-form-panel">
    <form class="auth-form" action="dashboard.html">
      <div class="auth-heading">
        <span class="eyebrow">Welcome back</span>
        <h1>Organization login</h1>
        <p>Access your inventory and transfer dashboard.</p>
      </div>
      <label>Email address<input type="email" value="admin@citycare.org" required></label>
      <label>Password<input type="password" value="aashray123" required></label>
      <div class="form-options"><label class="check-label"><input type="checkbox" checked> Remember me</label><a href="#">Forgot password?</a></div>
      <button class="btn btn-primary btn-full" type="submit">Sign in</button>
      <p class="auth-switch">New organization? <a href="register.html">Register here</a></p>
    </form>
  </main>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
